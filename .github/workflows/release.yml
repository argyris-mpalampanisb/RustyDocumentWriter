# Builds portable RustyDocumentWriter executables for Windows, macOS and Linux on
# x86_64 and ARM64. Run it manually (Actions → Release → Run workflow) or push a
# tag like `v0.1.0` to also publish a GitHub Release with the archives.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Build (static CRT via .cargo/config.toml)
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - name: Third-party license notices
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - name: Package
        shell: pwsh
        run: |
          $name = "rusty-document-writer-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rusty-document-writer.exe", "target/${{ matrix.target }}/release/rusty-document-writer-render.exe", "target/${{ matrix.target }}/release/rusty-document-writer-convert.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, THIRD-PARTY-LICENSES.html, assets/fonts/LICENSE-LiberationFonts-OFL.txt "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
      - uses: actions/upload-artifact@v4
        with: { name: "rusty-document-writer-windows-${{ matrix.arch }}", path: "dist/*.zip" }

  macos:
    name: macOS (x64, arm64, universal)
    # macos-latest always maps to a supported Apple Silicon image (macos-14 has been retired).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "x86_64-apple-darwin,aarch64-apple-darwin" }
      - name: Build both architectures
        env: { MACOSX_DEPLOYMENT_TARGET: "11.0" }
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - name: Third-party license notices
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - name: Package .app bundles
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          make_app () {  # $1 = label, $2.. = binaries to lipo together
            label=$1; shift
            app="dist/rusty-document-writer-macos-$label/RustyDocumentWriter.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
            lipo -create $(for t in "$@"; do echo target/$t/release/rusty-document-writer; done) -output "$app/Contents/MacOS/rusty-document-writer"
            lipo -create $(for t in "$@"; do echo target/$t/release/rusty-document-writer-render; done) -output "dist/rusty-document-writer-macos-$label/rusty-document-writer-render"
            lipo -create $(for t in "$@"; do echo target/$t/release/rusty-document-writer-convert; done) -output "dist/rusty-document-writer-macos-$label/rusty-document-writer-convert"
            # Ad-hoc signature so Apple Silicon will launch it (not notarized).
            codesign --force --deep -s - "$app"
            cp README.md LICENSE THIRD-PARTY-LICENSES.html assets/fonts/LICENSE-LiberationFonts-OFL.txt "dist/rusty-document-writer-macos-$label/"
            (cd dist && zip -qry "rusty-document-writer-macos-$label.zip" "rusty-document-writer-macos-$label")
          }
          make_app x64 x86_64-apple-darwin
          make_app arm64 aarch64-apple-darwin
          make_app universal x86_64-apple-darwin aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with: { name: rusty-document-writer-macos, path: "dist/*.zip" }

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Build
        # Ubuntu 22.04 ⇒ runs on glibc 2.35+ distros (Ubuntu 22.04+, Debian 12+, Fedora 36+).
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - name: Third-party license notices
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - name: Package
        run: |
          name=rusty-document-writer-linux-${{ matrix.arch }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/rusty-document-writer target/${{ matrix.target }}/release/rusty-document-writer-render target/${{ matrix.target }}/release/rusty-document-writer-convert dist/$name/
          cp README.md LICENSE THIRD-PARTY-LICENSES.html assets/fonts/LICENSE-LiberationFonts-OFL.txt packaging/linux/rusty-document-writer.desktop dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      - uses: actions/upload-artifact@v4
        with: { name: "rusty-document-writer-linux-${{ matrix.arch }}", path: "dist/*.tar.gz" }

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
