[package]
name = "rusty-document-writer"
version = "0.2.0"
edition = "2024"
description = "Open-source word processor built around faithful DOCX layout"
license = "MIT"
default-run = "rusty-document-writer"

[lib]
name = "rusty_document_writer"
path = "src/lib.rs"

[[bin]]
name = "rusty-document-writer"
path = "src/main.rs"

[[bin]]
name = "rusty-document-writer-render"
path = "src/bin/render.rs"

[[bin]]
name = "rusty-document-writer-convert"
path = "src/bin/convert.rs"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
krilla = "0.8.2"
rfd = "0.18.0"
ttf-parser = "0.25.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
