# cargo-about configuration: generates THIRD-PARTY-LICENSES.html, the copyright
# notices our dependencies' licenses require us to ship with binaries.
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
#
# Only permissive licenses are accepted. Crates offering a copyleft option
# (e.g. "Apache-2.0 OR GPL-2.0-only") are used under their permissive option.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Notices are only required for what ships in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Release targets — the dependency set differs per platform.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
